# Railway 部署配置（config-as-code）。
#
# 纯静态部署：没有数据库，没有 Volume，不需要任何环境变量 —— 宪法 C6 决定了
# 运行时不会向外发请求，所以也没有密钥可配。$PORT 由 Railway 注入，nginx 模板
# 在启动时用 envsubst 填。
#
# T-221：两个枚举值改成大写。Railway 的 schema 认的是 DOCKERFILE / ON_FAILURE，
# 小写会被判成无效值并**静默回落到默认**——重启策略看起来配了，实际没配。

[build]
builder        = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath         = "/healthz"
healthcheckTimeout      = 60
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 3
