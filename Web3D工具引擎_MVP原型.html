<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web 3D 工具引擎 · MVP 原型</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<style>
:root{
  --ink:#14171A; --panel:#1C2126; --raise:#232A31; --line:#2C333A; --line2:#3A434C;
  --steel:#8A959E; --chalk:#E6EAED; --dim:#5E6A73;
  --signal:#F2B01E; --cyan:#4AA8C7; --alert:#E2603F; --ok:#63B37A;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--sans);font-size:13px;line-height:1.5;overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-rows:46px 1fr 26px;height:100vh}

/* ---- top bar ---- */
header{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;padding-right:12px;border-right:1px solid var(--line)}
.brand b{font-weight:600;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 13px;cursor:pointer;color:var(--steel)}
.seg button[aria-pressed="true"]{background:var(--signal);color:#14171A;font-weight:600}
.tbtn{background:var(--raise);border:1px solid var(--line2);border-radius:3px;padding:5px 10px;cursor:pointer;color:var(--chalk)}
.tbtn:hover:not(:disabled){border-color:var(--steel)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.key{background:var(--signal);border-color:var(--signal);color:#14171A;font-weight:600}
.spacer{flex:1}
.ver{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ver b{color:var(--cyan);font-weight:400}

/* ---- layout ---- */
main{display:grid;grid-template-columns:250px 1fr 314px;min-height:0}
main.play{grid-template-columns:0 1fr 0}
main.play aside{display:none}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
aside.right{border-right:0;border-left:1px solid var(--line)}
.pane{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
.pane.grow{flex:1}
.ph{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:11px;letter-spacing:.06em;color:var(--steel);flex:0 0 auto}
.ph::before{content:"";width:2px;height:11px;background:var(--tick,var(--line2));flex:0 0 auto}
.ph .c{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.pb{overflow:auto;padding:0 12px 12px}
.pb.pad{padding:0 12px 14px}

/* ---- tree ---- */
.tree{list-style:none}
.tree li>div{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:3px;cursor:pointer}
.tree li>div:hover{background:var(--raise)}
.tree li>div.sel{background:#3A3016;box-shadow:inset 2px 0 0 var(--signal)}
.tree .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .grp{color:var(--steel);font-size:11px;letter-spacing:.04em}
.tree ul{list-style:none;padding-left:13px;border-left:1px solid var(--line)}
.eye{width:18px;height:18px;border:0;background:transparent;cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:11px}
.eye.on{color:var(--cyan)}

/* ---- viewport ---- */
.stage{position:relative;background:#0F1215;min-width:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hs{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.hs i{display:block;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--signal);background:rgba(242,176,30,.22)}
.hs b{position:absolute;left:20px;top:-4px;white-space:nowrap;font-size:11px;padding:2px 7px;background:rgba(20,23,26,.86);border:1px solid var(--line2);border-radius:2px;font-weight:400}
.hs.occ{opacity:.22}
.hs.hot i{background:var(--signal)}
.card{position:absolute;right:16px;bottom:16px;width:266px;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--signal);border-radius:3px;padding:12px 13px}
.card h4{font-size:13px;font-weight:600;margin-bottom:5px}
.card p{color:var(--steel);font-size:12px}
.card button{position:absolute;top:7px;right:8px;background:transparent;border:0;color:var(--dim);cursor:pointer;font-family:var(--mono)}
.badge{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--cyan);border:1px solid var(--line2);padding:3px 7px;border-radius:2px;background:rgba(20,23,26,.7)}
.hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--dim)}

/* ---- flow strip ---- */
.flow{display:flex;align-items:center;gap:0;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.step{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 9px;border:1px solid var(--line2);border-right:0;color:var(--dim);white-space:nowrap;font-size:12px}
.step:last-child{border-right:1px solid var(--line2)}
.step em{font-family:var(--mono);font-style:normal;font-size:10px}
.step.done{color:var(--steel);border-color:var(--line2)}
.step.now{color:#14171A;background:var(--signal);border-color:var(--signal);font-weight:600}

/* ---- property form ---- */
.row{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;margin-top:7px}
.row label{color:var(--steel);font-size:11px}
.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
input[type=text],input[type=number],select{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:4px 6px;font-family:var(--mono);font-size:11px}
input[type=range]{width:100%;accent-color:var(--signal)}
input[type=checkbox]{accent-color:var(--signal)}
input[type=color]{width:100%;height:24px;background:var(--ink);border:1px solid var(--line2);border-radius:2px;padding:1px}
.note{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line2);color:var(--dim);font-size:11px}
.empty{color:var(--dim);font-size:12px;padding:6px 0}

/* ---- rule chains (signature) ---- */
.rule{border:1px solid var(--line);border-radius:3px;margin-top:8px;background:var(--raise)}
.rule.off{opacity:.42}
.rtop{display:flex;align-items:center;gap:7px;padding:6px 8px}
.rtop .nm{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtop input{width:auto}
.chain{display:flex;align-items:stretch;padding:0 8px 8px;gap:0;flex-wrap:wrap;row-gap:5px}
.chip{position:relative;display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border:1px solid var(--line2);background:var(--ink);font-size:11px;min-width:0}
.chip+.chip{border-left:0}
.chip .k{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--dim)}
.chip .v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ev{border-color:#3B5A66;color:var(--cyan)}
.chip.cd{border-color:#4A4130;color:#D7B36A}
.chip.ac{border-color:#3B4A3E;color:#9CC9A8}
.rule.firing .chip{animation:pulse .46s ease-out both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes pulse{0%{background:var(--signal);color:#14171A}100%{background:var(--ink)}}
@media (prefers-reduced-motion:reduce){.rule.firing .chip{animation:none;box-shadow:inset 0 0 0 1px var(--signal)}}
.addrule{width:100%;margin-top:9px;background:transparent;border:1px dashed var(--line2);border-radius:3px;padding:6px;color:var(--steel);cursor:pointer}
.addrule:hover{border-color:var(--signal);color:var(--signal)}

/* ---- status ---- */
footer{display:flex;align-items:center;gap:0;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:0 12px;overflow-x:auto;white-space:nowrap}
footer span{padding:0 11px;border-right:1px solid var(--line)}
footer span:first-child{padding-left:0}
footer b{color:var(--steel);font-weight:400}
footer .warn b{color:var(--alert)}

/* ---- overlays ---- */
.sheet{position:fixed;inset:0;background:rgba(10,12,14,.72);display:none;align-items:center;justify-content:center;padding:34px;z-index:20}
.sheet.open{display:flex}
.sheet>div{background:var(--panel);border:1px solid var(--line2);border-radius:4px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column}
.sheet h3{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;background:transparent;border:0;color:var(--dim);cursor:pointer;font-family:var(--mono)}
.sheet pre{margin:0;padding:14px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--steel)}
.pop{position:absolute;top:40px;right:14px;background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:11px 13px;width:196px;z-index:15;display:none}
.pop.open{display:block}
.pop label{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px}
.pop .tbtn{width:100%;margin-top:4px}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--signal);color:#14171A;font-size:12px;font-weight:600;padding:7px 15px;border-radius:2px;z-index:30;opacity:0;transition:opacity .18s}
.toast.on{opacity:1}

@media (max-width:1080px){
  main{grid-template-columns:1fr;grid-template-rows:auto 52vh auto}
  aside{border:0;border-top:1px solid var(--line);max-height:32vh}
  aside.right{border-left:0}
}
</style>

<div id="app">
  <header>
    <div class="brand"><b>Web 3D 工具引擎</b><span>MVP / 垂直切片</span></div>
    <div class="seg" role="group" aria-label="模式">
      <button id="mEdit" aria-pressed="true">编辑</button>
      <button id="mPlay" aria-pressed="false">播放</button>
    </div>
    <button class="tbtn" id="bUndo" title="Ctrl+Z">撤销</button>
    <button class="tbtn" id="bRedo" title="Ctrl+Shift+Z">重做</button>
    <button class="tbtn" id="bReset">复位场景</button>
    <div class="spacer"></div>
    <span class="ver" id="verLbl">未发布</span>
    <button class="tbtn" id="bJson">查看场景 JSON</button>
    <button class="tbtn" id="bShot">导出图片</button>
    <button class="tbtn key" id="bPub">发布版本</button>
    <div class="pop" id="shotPop">
      <label><input type="checkbox" id="oHot" checked>包含热点标注</label>
      <label><input type="checkbox" id="oAlpha">透明背景</label>
      <label><input type="checkbox" id="o2x" checked>2 倍分辨率</label>
      <button class="tbtn key" id="bShotGo">导出 PNG</button>
    </div>
  </header>

  <main id="main">
    <aside>
      <div class="pane grow" style="--tick:#7F77DD">
        <div class="ph">场景层级<span class="c" id="cNodes"></span></div>
        <div class="pb"><ul class="tree" id="tree"></ul></div>
      </div>
      <div class="pane" style="--tick:#1D9E75">
        <div class="ph">动画序列<span class="c" id="cAnim"></span></div>
        <div class="pb pad" id="animList"></div>
      </div>
      <div class="pane" style="--tick:#4AA8C7">
        <div class="ph">热点标注<span class="c" id="cHot"></span></div>
        <div class="pb pad" id="hotList"></div>
      </div>
    </aside>

    <div style="display:flex;flex-direction:column;min-width:0">
      <div class="stage" id="stage">
        <span class="badge" id="badge">编辑器视口</span>
        <span class="hint" id="hint">左键旋转 · 滚轮缩放 · 右键平移 · 点击零件选中</span>
      </div>
      <div class="flow" id="flow"></div>
    </div>

    <aside class="right">
      <div class="pane" style="--tick:#F2B01E">
        <div class="ph">属性<span class="c" id="cSel"></span></div>
        <div class="pb pad" id="props"><p class="empty">在视口或层级树中选择一个对象</p></div>
      </div>
      <div class="pane grow" style="--tick:#E2603F">
        <div class="ph">交互规则 · 事件-条件-动作<span class="c" id="cRules"></span></div>
        <div class="pb pad" id="rules"></div>
      </div>
    </aside>
  </main>

  <footer>
    <span>三角面 <b class="num" id="sTri">0</b></span>
    <span>绘制调用 <b class="num" id="sCalls">0</b></span>
    <span>材质实例 <b class="num" id="sMat">0</b></span>
    <span>节点 <b class="num" id="sNode">0</b></span>
    <span>当前步骤 <b id="sStep">—</b></span>
    <span>变量 <b class="num" id="sVar">—</b></span>
    <span id="sBudget">资产体检 <b>—</b></span>
  </footer>
</div>

<div class="sheet" id="jsonSheet"><div>
  <h3>场景文档模型（实时）<button id="bJsonX">关闭</button></h3>
  <pre id="jsonBody"></pre>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   1. 场景文档模型 —— 全系统唯一数据源
   ============================================================ */
const BASE_DOC = {
  schemaVersion: 1,
  meta: { unit:'m', upAxis:'Y' },
  nodes: [
    { id:'nd_base',  name:'底座',     parent:null,       geom:{k:'box',a:[2.4,.18,1.1]},        transform:{p:[0,.09,0],r:[0,0,0],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_cast'} },
    { id:'g_pump',   name:'泵组件',   parent:null,       geom:null,                             transform:{p:[0,0,0],r:[0,0,0],s:[1,1,1]},   visible:true, overrides:{} },
    { id:'nd_body',  name:'泵壳',     parent:'g_pump',   geom:{k:'cyl',a:[.42,.42,.52,32]},     transform:{p:[-.62,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_cast'} },
    { id:'nd_cover', name:'泵盖',     parent:'g_pump',   geom:{k:'cyl',a:[.44,.44,.07,32]},     transform:{p:[-.92,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_steel'} },
    { id:'nd_imp',   name:'叶轮',     parent:'g_pump',   geom:{k:'imp',a:[.3,.09,6]},           transform:{p:[-.66,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_brass'} },
    { id:'nd_shaft', name:'主轴',     parent:'g_pump',   geom:{k:'cyl',a:[.055,.055,.86,20]},   transform:{p:[-.1,.62,0],r:[0,0,90],s:[1,1,1]},  visible:true, overrides:{materialId:'mat_steel'} },
    { id:'g_motor',  name:'电机组件', parent:null,       geom:null,                             transform:{p:[0,0,0],r:[0,0,0],s:[1,1,1]},   visible:true, overrides:{} },
    { id:'nd_coup',  name:'联轴器',   parent:'g_motor',  geom:{k:'cyl',a:[.13,.13,.16,24]},     transform:{p:[.36,.62,0],r:[0,0,90],s:[1,1,1]},  visible:true, overrides:{materialId:'mat_brass'} },
    { id:'nd_motor', name:'电机',     parent:'g_motor',  geom:{k:'cyl',a:[.31,.31,.78,28]},     transform:{p:[.92,.62,0],r:[0,0,90],s:[1,1,1]},  visible:true, overrides:{materialId:'mat_paint'} },
    { id:'nd_fan',   name:'风扇罩',   parent:'g_motor',  geom:{k:'cyl',a:[.19,.28,.16,24]},     transform:{p:[1.38,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_cast'} },
    { id:'g_pipe',   name:'管路',     parent:null,       geom:null,                             transform:{p:[0,0,0],r:[0,0,0],s:[1,1,1]},   visible:true, overrides:{} },
    { id:'nd_in',    name:'进水管',   parent:'g_pipe',   geom:{k:'cyl',a:[.15,.15,.62,20]},     transform:{p:[-1.32,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_pipe'} },
    { id:'nd_out',   name:'出水管',   parent:'g_pipe',   geom:{k:'cyl',a:[.12,.12,.66,20]},     transform:{p:[-.62,1.28,0],r:[0,0,0],s:[1,1,1]},  visible:true, overrides:{materialId:'mat_pipe'} },
    { id:'nd_bolts', name:'盖板螺栓', parent:'g_pump',   geom:{k:'bolts',a:[.33,6,.05,.09]},    transform:{p:[-.955,.62,0],r:[0,0,90],s:[1,1,1]}, visible:true, overrides:{materialId:'mat_steel'} }
  ],
  materials: [
    { id:'mat_cast',  name:'铸铁',     params:{ color:'#5A6068', metalness:.55, roughness:.72, opacity:1 } },
    { id:'mat_steel', name:'不锈钢',   params:{ color:'#9AA3AB', metalness:.92, roughness:.28, opacity:1 } },
    { id:'mat_brass', name:'黄铜',     params:{ color:'#B08D4A', metalness:.88, roughness:.34, opacity:1 } },
    { id:'mat_paint', name:'工业蓝漆', params:{ color:'#2E5C74', metalness:.22, roughness:.55, opacity:1 } },
    { id:'mat_pipe',  name:'管道灰',   params:{ color:'#6E747A', metalness:.4,  roughness:.62, opacity:1 } },
    { id:'mat_worn',  name:'磨损标记', params:{ color:'#C24A2E', metalness:.35, roughness:.68, opacity:1 } }
  ],
  animations: [
    { id:'anm_bolt',  name:'拆卸螺栓',   kind:'tween', duration:900,  easing:'easeOutCubic',
      targets:[{ nodeId:'nd_bolts', to:{ p:[-1.45,.62,0] } }] },
    { id:'anm_cover', name:'打开泵盖',   kind:'tween', duration:1100, easing:'easeInOutCubic',
      targets:[{ nodeId:'nd_cover', to:{ p:[-1.72,.62,0] } }] },
    { id:'anm_imp',   name:'抽出叶轮',   kind:'tween', duration:1000, easing:'easeInOutCubic',
      targets:[{ nodeId:'nd_imp',   to:{ p:[-1.22,.62,.02] } }] },
    { id:'anm_motor', name:'移出电机',   kind:'tween', duration:1200, easing:'easeInOutCubic',
      targets:[{ nodeId:'nd_motor', to:{ p:[1.55,.62,0] } },{ nodeId:'nd_fan', to:{ p:[2.01,.62,0] } }] }
  ],
  hotspots: [
    { id:'hs_imp',  name:'叶轮磨损检查', anchor:{ nodeId:'nd_imp',  offset:[0,.34,0] }, occlude:true,
      content:{ title:'叶轮磨损检查', body:'测量叶片出口厚度，低于原始值 80% 需更换。检查平衡孔是否堵塞。' } },
    { id:'hs_seal', name:'机械密封',     anchor:{ nodeId:'nd_body', offset:[.3,.2,0] },  occlude:true,
      content:{ title:'机械密封', body:'停机后观察渗漏量，每分钟超过 5 滴需更换密封组件。' } },
    { id:'hs_bolt', name:'紧固件扭矩',   anchor:{ nodeId:'nd_bolts',offset:[0,.42,0] }, occlude:true,
      content:{ title:'紧固件扭矩', body:'对角交叉分次拧紧，最终扭矩 45 N·m。禁止单侧一次拧到位。' } }
  ],
  viewpoints: [
    { id:'vp_home', name:'总览',   camera:{ p:[3.3,2.5,4.2],  t:[0,.7,0] } },
    { id:'vp_imp',  name:'叶轮位', camera:{ p:[-2.5,1.1,1.9], t:[-1.0,.65,0] } }
  ],
  variables: [
    { id:'step',    type:'number',  default:1 },
    { id:'boltOff', type:'boolean', default:false }
  ],
  rules: [
    { id:'rl_enter', name:'进入播放器时归位', enabled:true, mode:'parallel',
      when:{ event:'pageEnter' },
      if:[],
      then:[ { action:'moveCamera', viewpointId:'vp_home' },
             { action:'openPanel', title:'检修流程', body:'按提示点击零件完成三个步骤。当前步骤：拆卸紧固件。' } ] },
    { id:'rl_block', name:'未拆螺栓时阻止开盖', enabled:true, mode:'parallel',
      when:{ event:'click', nodeId:'nd_cover' },
      if:[ { op:'eq', var:'boltOff', value:false } ],
      then:[ { action:'highlight', nodeId:'nd_bolts' },
             { action:'openPanel', title:'顺序错误', body:'泵盖被 6 条螺栓固定，请先拆卸紧固件。' } ] },
    { id:'rl_bolt', name:'拆卸螺栓 → 进入步骤二', enabled:true, mode:'sequence',
      when:{ event:'click', nodeId:'nd_bolts' },
      if:[ { op:'eq', var:'step', value:1 } ],
      then:[ { action:'playAnimation', animationId:'anm_bolt' },
             { action:'setVariable', varId:'boltOff', value:true },
             { action:'setVariable', varId:'step', value:2 },
             { action:'gotoFlowStep', stepId:'st_2' } ] },
    { id:'rl_cover', name:'开盖并抽出叶轮', enabled:true, mode:'sequence',
      when:{ event:'click', nodeId:'nd_cover' },

function commit(fn){ past.push(clone(doc)); if(past.length>60) past.shift(); future.length=0; fn(); afterDocChange(); }
function undo(){ if(!past.length) return; future.push(clone(doc)); doc = past.pop(); rebuildAll(); }
function redo(){ if(!future.length) return; past.push(clone(doc)); doc = future.pop(); rebuildAll(); }

   3. Runtime Core —— 编辑器预览与只读播放器共用这一段

scene.background = new THREE.Color('#0F1215');

const key = new THREE.DirectionalLight('#FFF6E4', 2.1);
key.position.set(4.2,6.5,4.4); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-5; key.shadow.camera.right=5; key.shadow.camera.top=5; key.shadow.camera.bottom=-5;

const root = new THREE.Group(); scene.add(root);
const meshes = Object.create(null);   // nodeId -> Object3D
const matInst = Object.create(null);  // nodeId -> 材质实例（写时复制）
let outline = null;

function geomFor(g){
  if(!g) return null;
  const a = g.a;
  if(g.k==='box') return new THREE.BoxGeometry(a[0],a[1],a[2]);
  if(g.k==='cyl') return new THREE.CylinderGeometry(a[0],a[1],a[2],a[3]);
  if(g.k==='imp'){
    const parts = [], r=a[0], t=a[1], n=a[2];
    const hub = new THREE.CylinderGeometry(r*.32,r*.32,t*1.5,20); parts.push(hub);
    for(let i=0;i<n;i++){
      const b = new THREE.BoxGeometry(r*.92,t*.55,r*.2);
      const m = new THREE.Matrix4().makeRotationY(i*Math.PI*2/n)
        .multiply(new THREE.Matrix4().makeTranslation(r*.5,0,0));
      b.applyMatrix4(m); parts.push(b);
    }
    return mergeGeoms(parts);
  }
  if(g.k==='bolts'){
    const parts = [], R=a[0], n=a[1], br=a[2], bl=a[3];
    for(let i=0;i<n;i++){
      const c = new THREE.CylinderGeometry(br,br,bl,10);
      const ang = i*Math.PI*2/n;
      c.applyMatrix4(new THREE.Matrix4().makeTranslation(Math.cos(ang)*R, 0, Math.sin(ang)*R));
      parts.push(c);
    }
    return mergeGeoms(parts);
  }
  return new THREE.BoxGeometry(.2,.2,.2);
}
function mergeGeoms(list){
  const pos=[], nor=[];
  list.forEach(g=>{
    const p=g.attributes.position, nn=g.attributes.normal, idx=g.index;
    const push=i=>{ pos.push(p.getX(i),p.getY(i),p.getZ(i)); nor.push(nn.getX(i),nn.getY(i),nn.getZ(i)); };
    if(idx){ for(let i=0;i<idx.count;i++) push(idx.getX(i)); }
    else { for(let i=0;i<p.count;i++) push(i); }
    g.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  return out;
}

function makeMaterial(nid){
  const n = node(nid);
  const m = byId(doc.materials, n.overrides.materialId) || doc.materials[0];
  const p = m.params;
  // 写时复制：每个节点持有独立材质实例，避免共享材质被联动修改
  return new THREE.MeshStandardMaterial({
    color:new THREE.Color(p.color), metalness:p.metalness, roughness:p.roughness,
    transparent:p.opacity<1, opacity:p.opacity
  });
}

function buildScene(){
  while(root.children.length) root.remove(root.children[0]);
  for(const k in meshes) delete meshes[k];
  for(const k in matInst) delete matInst[k];
  doc.nodes.forEach(n=>{
    let obj;
    if(!n.geom){ obj = new THREE.Group(); }
    else {
      const mat = makeMaterial(n.id); matInst[n.id] = mat;
      obj = new THREE.Mesh(geomFor(n.geom), mat);
      obj.castShadow = true; obj.receiveShadow = true;
    }
    obj.name = n.id; obj.userData.nodeId = n.id;
    meshes[n.id] = obj;
  });
  doc.nodes.forEach(n=>{ (n.parent ? meshes[n.parent] : root).add(meshes[n.id]); });
  syncTransforms(); syncMaterials();
}
function syncTransforms(){
  doc.nodes.forEach(n=>{
    const o = meshes[n.id]; if(!o) return;
    o.position.set(n.transform.p[0], n.transform.p[1], n.transform.p[2]);
    o.rotation.set(THREE.MathUtils.degToRad(n.transform.r[0]),
                   THREE.MathUtils.degToRad(n.transform.r[1]),
                   THREE.MathUtils.degToRad(n.transform.r[2]));
    o.scale.set(n.transform.s[0], n.transform.s[1], n.transform.s[2]);
    o.visible = n.visible;
  });
}
function syncMaterials(){
  doc.nodes.forEach(n=>{
    const mat = matInst[n.id]; if(!mat) return;
    const m = byId(doc.materials, n.overrides.materialId); if(!m) return;
    mat.color.set(m.params.color);
    mat.metalness = m.params.metalness; mat.roughness = m.params.roughness;
    mat.opacity = m.params.opacity; mat.transparent = m.params.opacity < 1;
  });
}

/* ---- 相机控制（自研，避免依赖 examples 模块） ---- */
const cam = { tgt:new THREE.Vector3(0,.7,0), the:.72, phi:1.06, dist:6.0 };
function applyCam(){
  camera.position.set(
    cam.tgt.x + cam.dist*Math.sin(cam.phi)*Math.cos(cam.the),
    cam.tgt.y + cam.dist*Math.cos(cam.phi),
    cam.tgt.z + cam.dist*Math.sin(cam.phi)*Math.sin(cam.the));
  camera.lookAt(cam.tgt);
}
applyCam();
let drag = null;
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('pointerdown', e=>{
  drag = { x:e.clientX, y:e.clientY, b:e.button, moved:0 };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  drag.moved += Math.abs(dx)+Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
  if(drag.b===2 || e.shiftKey){
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    const k = cam.dist*0.0016;
    cam.tgt.addScaledVector(right,-dx*k).addScaledVector(up, dy*k);
  } else {
    cam.the -= dx*0.006;
    cam.phi = Math.max(.12, Math.min(Math.PI-.12, cam.phi - dy*0.006));
  }
  applyCam();
});
renderer.domElement.addEventListener('pointerup', e=>{
  const d = drag; drag = null;
  if(d && d.moved < 5 && d.b === 0) pick(e);
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  cam.dist = Math.max(1.4, Math.min(18, cam.dist * (1 + Math.sign(e.deltaY)*0.09)));
  applyCam();
}, { passive:false });

function flyTo(vp, ms){
  const c = vp && vp.camera; if(!c) return Promise.resolve();
  const tgt = new THREE.Vector3(c.t[0],c.t[1],c.t[2]);
  const pos = new THREE.Vector3(c.p[0],c.p[1],c.p[2]);
  const off = pos.clone().sub(tgt);
  const dist = off.length();
  const phi = Math.acos(Math.max(-1,Math.min(1,off.y/dist)));
  const the = Math.atan2(off.z, off.x);
  return tween(ms||800, 'easeInOutCubic', {
    the0:cam.the, phi0:cam.phi, d0:cam.dist, t0:cam.tgt.clone()
  }, (s,st)=>{
    let dThe = the - st.the0;
    while(dThe >  Math.PI) dThe -= Math.PI*2;
    while(dThe < -Math.PI) dThe += Math.PI*2;
    cam.the = st.the0 + dThe*s;
    cam.phi = st.phi0 + (phi-st.phi0)*s;
    cam.dist = st.d0 + (dist-st.d0)*s;
    cam.tgt.lerpVectors(st.t0, tgt, s);
    applyCam();
  });
}

/* ---- 补间引擎 ---- */
const EASE = {
  linear: t=>t,
  easeOutCubic: t=>1-Math.pow(1-t,3),
  easeInOutCubic: t=>t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2
};
let running = 0;
function tween(ms, ease, state, step){
  running++;
  return new Promise(res=>{
    const t0 = performance.now(), fn = EASE[ease]||EASE.linear;
    (function loop(now){
      const raw = Math.min(1,(now-t0)/ms);
      step(fn(raw), state);
      if(raw<1) requestAnimationFrame(loop); else { running--; res(); }
    })(t0);
  });
}
function playAnimation(id){
  const a = byId(doc.animations,id); if(!a) return Promise.resolve();
  const from = a.targets.map(t=>{
    const o = meshes[t.nodeId];
    return o ? o.position.clone() : new THREE.Vector3();
  });
  return tween(a.duration, a.easing, null, s=>{
    a.targets.forEach((t,i)=>{
      const o = meshes[t.nodeId]; if(!o || !t.to.p) return;
      o.position.set(
        from[i].x + (t.to.p[0]-from[i].x)*s,
        from[i].y + (t.to.p[1]-from[i].y)*s,
        from[i].z + (t.to.p[2]-from[i].z)*s);
    });
  }).then(()=>{ emit({ event:'animationEnd', animationId:id }); });
}

/* ---- 运行时变量与流程 ---- */
const rt = { vars:{}, step:null };
function resetRuntime(){
  rt.vars = {};
  doc.variables.forEach(v=>{ rt.vars[v.id] = v.default; });
  rt.step = doc.flows[0] ? doc.flows[0].steps[0].id : null;
  clearHighlight(); closePanel();
  syncTransforms(); syncMaterials();
  renderFlow(); renderStatus();
}

/* ---- 事件-条件-动作引擎 ---- */
function matchWhen(w, ev){
  if(w.event !== ev.event) return false;
  if(w.nodeId && w.nodeId !== ev.nodeId) return false;
  if(w.hotspotId && w.hotspotId !== ev.hotspotId) return false;
  if(w.animationId && w.animationId !== ev.animationId) return false;
  return true;
}
function evalIf(conds){
  return (conds||[]).every(c=>{
    const v = rt.vars[c.var];
    if(c.op==='eq')  return v === c.value;
    if(c.op==='neq') return v !== c.value;
    if(c.op==='gte') return v >= c.value;
    if(c.op==='lte') return v <= c.value;
    return true;
  });
}
const ACTIONS = {
  playAnimation: a => playAnimation(a.animationId),
  setVisible:    a => { const n = node(a.nodeId); if(n){ n.visible = !!a.value; syncTransforms(); } },
  setMaterial:   a => { const n = node(a.nodeId); if(n){ n.overrides.materialId = a.materialId; syncMaterials(); renderProps(); } },
  highlight:     a => { setHighlight(a.nodeId); },
  moveCamera:    a => flyTo(byId(doc.viewpoints,a.viewpointId)||{camera:{p:[3.3,2.5,4.2],t:[0,.7,0]}}),
  openPanel:     a => { const h = a.hotspotId ? byId(doc.hotspots,a.hotspotId) : null;
                        openPanel(h ? h.content.title : a.title, h ? h.content.body : a.body); },
  closePanel:    () => closePanel(),
  setVariable:   a => { rt.vars[a.varId] = a.value; renderStatus(); emit({ event:'variableChange', varId:a.varId }); },
  gotoFlowStep:  a => { rt.step = a.stepId; renderFlow(); },
  resetScene:    () => resetRuntime()
};
let depth = 0;
function emit(ev){
  if(depth > 6) return [];
  depth++;
  const fired = doc.rules.filter(r=>r.enabled && matchWhen(r.when,ev) && evalIf(r.if));
  fired.forEach(r=>{ flashRule(r.id); execute(r); });
  depth--;
  return fired;
}
async function execute(rule){
  const list = rule.then || [];
  if(rule.mode === 'sequence'){
    for(const a of list){ const f = ACTIONS[a.action]; if(f) await f(a); }
  } else {
    await Promise.all(list.map(a=>{ const f = ACTIONS[a.action]; return f ? f(a) : null; }));
  }
}

/* ---- 高亮（用边线叠加代替后处理描边） ---- */
function setHighlight(nid){
  clearHighlight();
  const o = meshes[nid]; if(!o || !o.geometry) return;
  outline = new THREE.LineSegments(
    new THREE.EdgesGeometry(o.geometry, 24),
    new THREE.LineBasicMaterial({ color:'#F2B01E' }));
  outline.userData.follow = nid;
  o.add(outline);
}
function clearHighlight(){ if(outline && outline.parent) outline.parent.remove(outline); outline = null; }

/* ---- 拾取 ---- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX-r.left)/r.width)*2-1;
  ndc.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(root.children, true)
    .filter(h => h.object.isMesh && h.object.visible);
  if(!hits.length){ if(mode==='edit'){ select(null); } return; }
  const nid = hits[0].object.userData.nodeId;
  if(mode==='edit') select(nid);
  emit({ event:'click', nodeId:nid });
}

/* ---- 热点（DOM 覆盖层 + 遮挡检测） ---- */
const hsEls = Object.create(null);
function buildHotspots(){
  Object.keys(hsEls).forEach(k=>{ hsEls[k].remove(); delete hsEls[k]; });
  doc.hotspots.forEach(h=>{
    const el = document.createElement('div');
    el.className = 'hs';
    el.innerHTML = '<i></i><b></b>';
    el.querySelector('b').textContent = h.name;
    el.addEventListener('pointerdown', e=>e.stopPropagation());
    el.addEventListener('click', e=>{ e.stopPropagation(); emit({ event:'hotspotClick', hotspotId:h.id }); });
    stage.appendChild(el); hsEls[h.id] = el;
  });
}
const wp = new THREE.Vector3();
let hsTick = 0;
function hotspotWorld(h){
  const o = meshes[h.anchor.nodeId];
  if(!o) return null;
  o.getWorldPosition(wp);
  return wp.clone().add(new THREE.Vector3(h.anchor.offset[0],h.anchor.offset[1],h.anchor.offset[2]));
}
function updateHotspots(){
  hsTick++;
  const r = renderer.domElement.getBoundingClientRect();
  doc.hotspots.forEach(h=>{
    const el = hsEls[h.id]; if(!el) return;
    const anchorNode = meshes[h.anchor.nodeId];
    if(!anchorNode || !anchorNode.visible){ el.style.display='none'; return; }
    const w = hotspotWorld(h); if(!w){ el.style.display='none'; return; }
    const p = w.clone().project(camera);
    if(p.z > 1){ el.style.display='none'; return; }
    el.style.display = 'block';
    el.style.left = ((p.x+1)/2*r.width) + 'px';
    el.style.top  = ((-p.y+1)/2*r.height) + 'px';
    if(h.occlude && hsTick % 4 === 0){
      const dir = w.clone().sub(camera.position);
      const dist = dir.length();
      ray.set(camera.position, dir.normalize());
      const hit = ray.intersectObjects(root.children, true).filter(x=>x.object.isMesh && x.object.visible)[0];
      el.classList.toggle('occ', !!hit && hit.distance < dist - .04);
    }
  });
}

function renderTree(){

  (function walk(pid, host){
    kids(pid).forEach(n=>{

/* 属性面板由字段 schema 生成 —— 单人开发的关键杠杆 */
const NODE_SCHEMA = [
  { key:'name',        label:'名称', type:'text' },
  { key:'visible',     label:'可见', type:'bool' },
  { key:'transform.p', label:'位置', type:'vec3', step:.01 },
  { key:'transform.r', label:'旋转', type:'vec3', step:1 },
  { key:'transform.s', label:'缩放', type:'vec3', step:.01 }
];
const MAT_SCHEMA = [
  { key:'color',     label:'颜色',   type:'color' },
  { key:'metalness', label:'金属度', type:'range' },
  { key:'roughness', label:'粗糙度', type:'range' },
  { key:'opacity',   label:'透明度', type:'range' }
];
const get = (o,path) => path.split('.').reduce((a,k)=>a&&a[k], o);

function field(f, obj, onSet){
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = f.label; row.appendChild(lab);
  const v = get(obj, f.key);
  if(f.type==='text'){
    const i = document.createElement('input'); i.type='text'; i.value = v;
    i.onchange = ()=>onSet(f.key, i.value); row.appendChild(i);
  } else if(f.type==='bool'){
    const i = document.createElement('input'); i.type='checkbox'; i.checked = !!v;
    i.onchange = ()=>onSet(f.key, i.checked);
    const w = document.createElement('div'); w.appendChild(i); row.appendChild(w);
  } else if(f.type==='vec3'){
    const w = document.createElement('div'); w.className='vec';
    v.forEach((n,i)=>{
      const inp = document.createElement('input');
      inp.type='number'; inp.step=f.step; inp.value = Math.round(n*1000)/1000;
      inp.onchange = ()=>{ const arr = v.slice(); arr[i] = parseFloat(inp.value)||0; onSet(f.key, arr); };
      w.appendChild(inp);
    });
    row.appendChild(w);
  } else if(f.type==='color'){
    const i = document.createElement('input'); i.type='color'; i.value = v;
    i.oninput = ()=>onSet(f.key, i.value); row.appendChild(i);
  } else if(f.type==='range'){
    const i = document.createElement('input');
    i.type='range'; i.min=0; i.max=1; i.step=.01; i.value = v;
    i.oninput = ()=>onSet(f.key, parseFloat(i.value)); row.appendChild(i);
  }
  return row;
}

function renderProps(){
  const box = $('props'); box.innerHTML = '';
  $('cSel').textContent = sel ? sel : '';
  if(!sel){ box.innerHTML = '<p class="empty">在视口或层级树中选择一个对象</p>'; return; }
  const n = node(sel);
  NODE_SCHEMA.forEach(f=>{
    if(f.key.startsWith('transform') && !n.geom && f.key!=='transform.p') return;
    box.appendChild(field(f, n, (k,val)=>{
      commit(()=>{
        if(k==='name') n.name = val;
        else if(k==='visible') n.visible = val;
        else n.transform[k.split('.')[1]] = val;
      });
    }));
  });
  if(n.geom){
    const row = document.createElement('div'); row.className='row';
    const lab = document.createElement('label'); lab.textContent='材质';
    const s = document.createElement('select');
    doc.materials.forEach(m=>{
      const o = document.createElement('option'); o.value=m.id; o.textContent=m.name;
      if(m.id===n.overrides.materialId) o.selected = true; s.appendChild(o);
    });
    s.onchange = ()=>commit(()=>{ n.overrides.materialId = s.value; });
    row.append(lab,s); box.appendChild(row);
    const m = byId(doc.materials, n.overrides.materialId);
    if(m) MAT_SCHEMA.forEach(f=>box.appendChild(field(f, m.params, (k,val)=>{
      commit(()=>{ m.params[k] = val; });
    })));
  }
  const note = document.createElement('p'); note.className='note';
  note.textContent = '本面板由字段 schema 自动生成，新增属性只需扩展 schema。';
  box.appendChild(note);
}

function renderAnims(){
  const box = $('animList'); box.innerHTML = '';
  doc.animations.forEach(a=>{
    const r = document.createElement('div'); r.className='row'; r.style.gridTemplateColumns='1fr auto';
    const l = document.createElement('span'); l.textContent = a.name;
    const b = document.createElement('button'); b.className='tbtn'; b.textContent='播放';
    b.onclick = ()=>playAnimation(a.id);
    r.append(l,b); box.appendChild(r);
  });
  $('cAnim').textContent = doc.animations.length + ' 条';
}
function renderHotspots(){
  const box = $('hotList'); box.innerHTML = '';
  doc.hotspots.forEach(h=>{
    const r = document.createElement('div'); r.className='row'; r.style.gridTemplateColumns='1fr auto';
    const l = document.createElement('span'); l.textContent = h.name;
    const b = document.createElement('button'); b.className='tbtn'; b.textContent='定位';
    b.onclick = ()=>{ select(h.anchor.nodeId); emit({ event:'hotspotClick', hotspotId:h.id }); };
    r.append(l,b); box.appendChild(r);
  });
  $('cHot').textContent = doc.hotspots.length + ' 个';
}

const EV_LABEL = { click:'点击对象', hotspotClick:'点击热点', animationEnd:'动画结束', pageEnter:'进入页面', variableChange:'变量变化' };
const AC_LABEL = { playAnimation:'播放动画', setVisible:'显隐对象', setMaterial:'替换材质', highlight:'高亮',
                   moveCamera:'切换相机', openPanel:'打开面板', closePanel:'关闭面板',
                   setVariable:'设置变量', gotoFlowStep:'跳转步骤', resetScene:'复位场景' };
function acText(a){
  if(a.action==='playAnimation'){ const x = byId(doc.animations,a.animationId); return x?x.name:a.animationId; }
  if(a.action==='setMaterial'){ const n = node(a.nodeId), m = byId(doc.materials,a.materialId); return (n?n.name:'') + ' → ' + (m?m.name:''); }
  if(a.action==='highlight' || a.action==='setVisible'){ const n = node(a.nodeId); return n?n.name:a.nodeId; }
  if(a.action==='moveCamera'){ const v = byId(doc.viewpoints,a.viewpointId); return v?v.name:a.viewpointId; }
  if(a.action==='openPanel'){ return a.title || (byId(doc.hotspots,a.hotspotId)||{content:{}}).content.title || '面板'; }
  if(a.action==='setVariable'){ return a.varId + ' = ' + a.value; }
  if(a.action==='gotoFlowStep'){ const f = doc.flows[0]; const s = f && byId(f.steps,a.stepId); return s?s.name:a.stepId; }
  return '';
}
function whenText(w){
  if(w.nodeId){ const n = node(w.nodeId); return n?n.name:w.nodeId; }
  if(w.hotspotId){ const h = byId(doc.hotspots,w.hotspotId); return h?h.name:w.hotspotId; }
  if(w.animationId){ const a = byId(doc.animations,w.animationId); return a?a.name:w.animationId; }
  return '—';
}
function chip(cls, kind, txt, i){
  const d = document.createElement('div'); d.className = 'chip '+cls; d.style.setProperty('--i', i);
  const u = document.createElement('span'); u.className = 'k'; u.textContent = kind;
  const s = document.createElement('span'); s.className = 'v'; s.textContent = txt; s.title = txt;
  d.append(u,s); return d;
}
function renderRules(){
  const box = $('rules'); box.innerHTML = '';
  doc.rules.forEach(r=>{
    const wrap = document.createElement('div');
    wrap.className = 'rule' + (r.enabled ? '' : ' off');
    wrap.dataset.rid = r.id;
    const top = document.createElement('div'); top.className='rtop';
    const on = document.createElement('input'); on.type='checkbox'; on.checked=r.enabled;
    on.title='启用规则';
    on.onchange = ()=>commit(()=>{ r.enabled = on.checked; });
    const nm = document.createElement('span'); nm.className='nm'; nm.textContent = r.name;
    const md = document.createElement('span'); md.style.cssText='font-family:var(--mono);font-size:9px;color:var(--dim)';
    md.textContent = r.mode === 'sequence' ? 'SEQ' : 'PAR';
    md.title = r.mode==='sequence' ? '动作顺序执行（可 await）' : '动作并行执行';
    top.append(on,nm,md);
    const ch = document.createElement('div'); ch.className='chain';
    let i = 0;
    ch.appendChild(chip('ev','事件', (EV_LABEL[r.when.event]||r.when.event)+' · '+whenText(r.when), i++));
    (r.if||[]).forEach(c=>ch.appendChild(chip('cd','条件', c.var+' '+c.op+' '+c.value, i++)));
    (r.then||[]).forEach(a=>ch.appendChild(chip('ac','动作', (AC_LABEL[a.action]||a.action)+' · '+acText(a), i++)));
    wrap.append(top,ch); box.appendChild(wrap);
  });
  const add = document.createElement('button'); add.className='addrule';
  add.textContent = sel ? ('＋ 为「'+node(sel).name+'」新建规则') : '＋ 先选中一个对象再新建规则';
  add.disabled = !sel;
  add.onclick = ()=>{
    if(!sel) return;
    commit(()=>{
      doc.rules.push({
        id:'rl_'+Math.random().toString(36).slice(2,7), name:'点击'+node(sel).name+'时高亮', enabled:true, mode:'sequence',
        when:{ event:'click', nodeId:sel }, if:[],
        then:[{ action:'highlight', nodeId:sel },
              { action:'openPanel', title:node(sel).name, body:'这是新建规则触发的说明面板。' }]
      });
    });
    toast('已新建规则');
  };
  box.appendChild(add);
  $('cRules').textContent = doc.rules.filter(r=>r.enabled).length + '/' + doc.rules.length + ' 启用';
}
function flashRule(id){
  const el = document.querySelector('.rule[data-rid="'+id+'"]');
  if(!el) return;
  el.classList.remove('firing');
  void el.offsetWidth;
  el.classList.add('firing');
}

function renderFlow(){
  const box = $('flow'); box.innerHTML = '';
  const f = doc.flows[0]; if(!f) return;
  let passed = true;
  f.steps.forEach((s,i)=>{
    const d = document.createElement('div');
    const now = s.id === rt.step;
    if(now) passed = false;
    d.className = 'step ' + (now ? 'now' : (passed ? 'done' : ''));
    const em = document.createElement('em'); em.textContent = String(i+1).padStart(2,'0');
    const sp = document.createElement('span'); sp.textContent = s.name;
    d.append(em,sp);
    d.onclick = ()=>{ rt.step = s.id; renderFlow(); renderStatus(); };
    box.appendChild(d);
  });
}

function renderStatus(){
  const info = renderer.info;
  $('sTri').textContent = (info.render.triangles||0).toLocaleString();
  $('sCalls').textContent = info.render.calls||0;
  $('sMat').textContent = Object.keys(matInst).length;
  $('sNode').textContent = doc.nodes.length;
  const f = doc.flows[0];
  const st = f && byId(f.steps, rt.step);
  $('sStep').textContent = st ? st.name : '—';
  $('sVar').textContent = doc.variables.map(v=>v.id+'='+rt.vars[v.id]).join('  ');
  const tri = info.render.triangles||0;
  const bud = $('sBudget');
  bud.innerHTML = '资产体检 <b>' + tri.toLocaleString() + ' / 300,000 面</b>';
  bud.className = tri > 300000 ? 'warn' : '';
}

function rebuildAll(){ buildScene(); buildHotspots(); resetRuntime(); renderTree(); renderProps(); renderAnims(); renderHotspots(); renderRules(); renderFlow(); updateHistoryBtns(); }
function afterDocChange(){ syncTransforms(); syncMaterials(); buildHotspots(); renderTree(); renderProps(); renderRules(); renderAnims(); renderHotspots(); updateHistoryBtns(); }
function updateHistoryBtns(){ $('bUndo').disabled = !past.length; $('bRedo').disabled = !future.length; }

/* ---- 模式切换：播放器读取已发布快照，不读草稿 ---- */
function setMode(m){
  mode = m;
  $('mEdit').setAttribute('aria-pressed', m==='edit');
  $('mPlay').setAttribute('aria-pressed', m==='play');
  $('main').classList.toggle('play', m==='play');
  $('badge').textContent = m==='play' ? '只读播放器 · 与编辑器同源运行时' : '编辑器视口';
  $('hint').textContent = m==='play'
    ? '按流程点击零件：先拆螺栓 → 再开泵盖 → 点击叶轮热点'
    : '左键旋转 · 滚轮缩放 · 右键平移 · 点击零件选中';
  if(m==='play'){
    draft = doc;                                    // 草稿保留，播放器只读快照
    if(snapshot){ doc = clone(snapshot); } else { toast('尚未发布，播放当前草稿'); }
    clearHighlight(); sel = null;
    rebuildAll();
    setTimeout(()=>emit({ event:'pageEnter' }), 80);
  } else {
    if(draft){ doc = draft; draft = null; }
    rebuildAll();
  }
  onResize();
}

/* ---- 发布：内容冻结 ---- */
$('bPub').onclick = ()=>{
  snapshot = clone(doc); pubNo++;
  $('verLbl').innerHTML = '已发布 <b>v' + pubNo + '</b> · ' + doc.nodes.length + ' 节点 / ' + doc.rules.length + ' 规则';
  toast('已发布 v' + pubNo + '，快照不可变');
};

/* ---- 导出 PNG（含热点合成，解决 DOM 热点无法进入 canvas 的问题） ---- */
$('bShot').onclick = e=>{ e.stopPropagation(); $('shotPop').classList.toggle('open'); };
document.addEventListener('click', e=>{
  if(!$('shotPop').contains(e.target) && e.target !== $('bShot')) $('shotPop').classList.remove('open');
});
$('bShotGo').onclick = ()=>{
  const withHot = $('oHot').checked, alpha = $('oAlpha').checked, x2 = $('o2x').checked;
  const w = stage.clientWidth, h = stage.clientHeight, s = x2 ? 2 : 1;
  const oldBg = scene.background, oldGrid = grid.visible, oldGround = ground.visible;
  if(alpha){ scene.background = null; grid.visible = false; ground.visible = false; }
  renderer.setPixelRatio(s);
  renderer.setSize(w,h,false);
  renderer.render(scene,camera);
  const out = document.createElement('canvas');
  out.width = w*s; out.height = h*s;
  const g = out.getContext('2d');
  if(!alpha){ g.fillStyle = '#0F1215'; g.fillRect(0,0,out.width,out.height); }
  g.drawImage(renderer.domElement, 0, 0, out.width, out.height);
  if(withHot){
    doc.hotspots.forEach(hp=>{
      const el = hsEls[hp.id];
      if(!el || el.style.display==='none' || el.classList.contains('occ')) return;
      const wpos = hotspotWorld(hp); if(!wpos) return;
      const p = wpos.clone().project(camera);
      const x = (p.x+1)/2*out.width, y = (-p.y+1)/2*out.height;
      g.strokeStyle = '#F2B01E'; g.lineWidth = 1.6*s; g.fillStyle = 'rgba(242,176,30,.24)';
      g.beginPath(); g.arc(x,y,7.5*s,0,Math.PI*2); g.fill(); g.stroke();
      g.font = (11*s)+'px sans-serif';
      const tw = g.measureText(hp.name).width;
      g.fillStyle = 'rgba(20,23,26,.86)';
      g.fillRect(x+10*s, y-9*s, tw+12*s, 18*s);
      g.strokeStyle = '#3A434C'; g.lineWidth = 1*s;
      g.strokeRect(x+10*s, y-9*s, tw+12*s, 18*s);
      g.fillStyle = '#E6EAED';
      g.fillText(hp.name, x+16*s, y+4*s);
    });
  }
  scene.background = oldBg; grid.visible = oldGrid; ground.visible = oldGround;
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  onResize();
  out.toBlob(b=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'web3d_' + Date.now() + '.png';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
  $('shotPop').classList.remove('open');
  toast('已导出 ' + (w*s) + '×' + (h*s) + ' PNG');
};

/* ---- JSON 面板 ---- */
$('bJson').onclick = ()=>{ $('jsonBody').textContent = JSON.stringify(doc, null, 2); $('jsonSheet').classList.add('open'); };
$('bJsonX').onclick = ()=>$('jsonSheet').classList.remove('open');
$('jsonSheet').onclick = e=>{ if(e.target === $('jsonSheet')) $('jsonSheet').classList.remove('open'); };

/* ---- 其它按钮 ---- */
$('mEdit').onclick = ()=>setMode('edit');
$('mPlay').onclick = ()=>setMode('play');
$('bUndo').onclick = undo;
$('bRedo').onclick = redo;
$('bReset').onclick = ()=>{ resetRuntime(); toast('场景已复位'); };
addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
});

let tt = null;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('on'), 1600);
}

/* ---- 渲染循环 ---- */
function onResize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}
addEventListener('resize', onResize);

let frame = 0;
(function loop(){
  requestAnimationFrame(loop);
  renderer.render(scene,camera);
  updateHotspots();
  if(++frame % 20 === 0) renderStatus();
})();

/* ---- 启动 ---- */
rebuildAll();
onResize();
setTimeout(onResize, 60);
})();
</script>
